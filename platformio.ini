; PlatformIO project for the Waveshare ESP32-S3-Touch-LCD-3.5B dev board.
; Basic LVGL example — based on demo_arduino/examples/10_lvgl_arduino_v9.
;
; Board    : Waveshare ESP32-S3-Touch-LCD-3.5B  (ESP32-S3R8)
; MCU      : ESP32-S3, 16 MB flash (QIO), 8 MB PSRAM (Octal / OPI)
; Display  : AXS15231B 320x480 RGB565 over QSPI (Arduino_GFX)
; Touch    : AXS15231B integrated touch over I2C @ 0x3B (lib/esp_lcd_touch_axs15231b)
; Reset    : LCD reset driven through a TCA9554 I2C IO-expander @ 0x20
;
; Most required libraries are pulled from the PlatformIO registry (latest
; versions compatible with LVGL v9's API, which lv_conf.h / main.cpp use).
; esp_lcd_touch_axs15231b has no registry package, so it's copied into lib/.

[env:waveshare_esp32s3_35]
platform = espressif32

; Exact hardware match: 16 MB flash + 8 MB OCTAL PSRAM.
; This board id sets memory_type=qio_opi, -DBOARD_HAS_PSRAM,
; flash_size=16MB and partitions=default_16MB.csv automatically.
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200

build_flags =
    ; --- LVGL config resolution ---
    -D LV_CONF_INCLUDE_SIMPLE   ; lvgl does: #include "lv_conf.h"
    -I include                  ; so it resolves include/lv_conf.h and board_config.h
    -I src                       ; so app/core/ui modules can use src-relative includes
    -D LV_LVGL_H_INCLUDE_SIMPLE
    ; --- Arduino-ESP32 USB serial (matches Arduino IDE board settings) ---
    ; Without these, Serial.println() goes to UART0 instead of the native
    ; USB port, so the sketch's own logs never appear on /dev/cu.usbmodem*.
    -D ARDUINO_USB_MODE=1        ; Hardware CDC and JTAG
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; route Serial to the USB CDC port
    ; --- Make ESP / library logs visible (log_i / log_e from SensorLib) ---
    -D CORE_DEBUG_LEVEL=3        ; 0=none .. 3=info, 5=verbose
    ; --- WiFi needs the arduino-esp32 3.x "Network" library ---
    ; WiFi's library.properties declares no `depends`, so LDF compiles the WiFi
    ; library without Network's include path ("Network.h: No such file"). Add it
    ; globally (packages_dir keeps this machine-independent).
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src"
    ; --- SD_MMC needs the bundled "FS" library (same missing-`depends` issue) ---
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src"
    ; --- HTTPClient (WLED JSON API) + its NetworkClientSecure dependency, same
    ;     missing-`depends` issue as Network/FS above ---
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/HTTPClient/src"
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src"
    ; --- ESPmDNS (WLED auto-discovery), same missing-`depends` issue ---
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/ESPmDNS/src"
    ; --- WebSockets (Stream Deck device client) needs WiFi.h directly, same
    ;     missing-`depends` issue as the libs above ---
    -I "${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src"

; LDF (deep+) compiles only the libs actually #included by src/main.cpp
; (lvgl, Arduino_GFX, TCA9554, SensorLib).
lib_ldf_mode = deep+
lib_deps =
    lvgl/lvgl@^9.2.2
    moononournation/GFX Library for Arduino@^1.6.5
    robtillaart/TCA9554@^0.1.3
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.1
